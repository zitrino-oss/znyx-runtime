[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "znyx-runtime"
version = "1.0.0"
description = "Znyx guardrails runtime: a lightweight FastAPI service that evaluates LLM traffic against policies. Rules-only out of the box; gains ML when pointed at a Znyx inference sidecar."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Zitrino" }]
keywords = ["llm", "guardrails", "safety", "ai-security", "fastapi", "policy"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
]
dependencies = [
  "znyx-core>=1.0.0",
  "fastapi>=0.109.0",
  "uvicorn[standard]>=0.27.0",
  "pydantic>=2.5.0",
  "pydantic-settings>=2.1.0",
  "python-multipart>=0.0.30",
  "python-dotenv>=1.0.0",
  # Declared explicitly because this package imports httpx DIRECTLY in five modules
  # (bundle_manager, telemetry, heartbeat, inference_sync, runtime_report). It previously
  # resolved only because znyx-core happens to depend on it, so the install would have broken
  # silently the day znyx-core dropped it.
  "httpx>=0.26.0",
]

[project.scripts]
znyx-runtime = "znyx_runtime.cli:main"

[project.urls]
Homepage = "https://github.com/zitrino-oss/znyx-runtime"
Source = "https://github.com/zitrino-oss/znyx-runtime"
Issues = "https://github.com/zitrino-oss/znyx-runtime/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
znyx_runtime = ["**/*.yaml", "**/*.yml", "**/*.json"]
