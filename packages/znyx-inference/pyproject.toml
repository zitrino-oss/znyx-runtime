[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "znyx-inference"
version = "1.0.0"
description = "Znyx inference sidecar: an optional HTTP service that serves ML models for model-backed guardrail detection. Boots dependency-free on a stub runner; add the [onnx] extra to serve real weights on CPU."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Zitrino" }]
keywords = ["llm", "guardrails", "inference", "ml-serving", "ai-security"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Core is intentionally light: the sidecar boots on a dependency-free stub runner
# with no ML stack installed. The heavy model runtimes are an optional extra.
dependencies = [
  "znyx-core>=1.0.0",
  "fastapi>=0.109.0",
  "uvicorn[standard]>=0.27.0",
  "pydantic>=2.5.0",
  "httpx>=0.26.0",
]

[project.optional-dependencies]
# --- [onnx] — the DEFAULT serving extra. CPU-only, torch-free. This is what the
# inference Docker image installs. Serves sha256-pinned local ONNX artifacts via
# onnxruntime + the standalone Rust `tokenizers` (no transformers, no torch, no CUDA).
# Weights are never bundled; export + pin them offline with the [export] extra (see MODELS.md).
#   pip install znyx-inference[onnx]
onnx = [
  "onnxruntime>=1.17,<2.0",
  "tokenizers>=0.19,<1.0",
  "numpy>=1.24",
]

# --- [export] — OFFLINE, operator/CI only. Never installed in the serving image. Pulls a
# vetted checkpoint and exports + dynamically-quantizes it to a pinned ONNX artifact
# (scripts/fetch_inference_model.py). This is the ONLY place torch lives in the normal flow.
#   pip install znyx-inference[export]
export = [
  "torch>=2.2,<3.0",
  "transformers>=4.40,<6.0",
  "optimum[exporters,onnxruntime]>=1.17,<2.0",
  "huggingface-hub>=0.23,<1.0",
]

# --- [torch] — OPT-IN escape hatch. Adds the eager PyTorch stack so the generative
# guard_llm runner (Llama-Guard-style causal LM) can serve, and so un-exported HF weights
# can be run directly. Heavy (pulls the torch CPU/GPU wheel); most detection is covered by
# the CPU-ONNX runners above, so install this only if you need generative guard.
#   pip install znyx-inference[torch]
torch = [
  "torch>=2.2,<3.0",
  "transformers>=4.40,<6.0",
]

[project.urls]
Homepage = "https://github.com/zitrino-oss/znyx-runtime"
Source = "https://github.com/zitrino-oss/znyx-runtime"
Issues = "https://github.com/zitrino-oss/znyx-runtime/issues"

[tool.setuptools.packages.find]
where = ["src"]
