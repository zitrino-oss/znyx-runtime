default:
  secrets:
    enabled: true
    exceptions:
    - sk-test-example
    - EXAMPLE_API_KEY
  exfiltration:
    enabled: true
    block_threshold: 40
  tools:
    enabled: true
    allowed: []
    denied: []
    schemas: {}
    domain_allowlist: []
    max_arg_size: 10000
  structure:
    enabled: false
    expected_format: null
    json_schema: null
    xml_root: null
  abuse:
    enabled: true
    max_chars_input: 100000
    max_chars_output: 100000
    max_tool_args_size: 50000
    rate_limit_per_minute: 60
    prompt_flood_threshold: 3
    prompt_flood_window: 60
  pii:
    enabled: true
    action: REDACT
  jailbreak:
    enabled: true
    threshold: 60
  toxicity:
    enabled: true
    action: WARN
    custom_terms: {}
  competitor:
    enabled: true
    action: WARN
    competitors:
    - Acme
  topic_restriction:
    enabled: true
    action: BLOCK

  # ── New Detectors ──────────────────────────────────────────
  gibberish:
    enabled: false
    action: BLOCK
    entropy_threshold: 5.5
    max_special_char_ratio: 0.4
    detect_invisible_chars: true
    detect_token_stuffing: true
    repetition_threshold: 5
  language:
    enabled: false
    action: BLOCK
    allowed_languages: []
    blocked_languages: []
    detect_mixed: false
    min_text_length: 20
  bias:
    enabled: false
    action: WARN
    protected_attributes:
    - gender
    - race
    - age
    - disability
    - religion
    sensitivity: medium
    industry_preset: general
  sentiment:
    enabled: false
    action: WARN
    blocked_tones:
    - sarcastic
    - condescending
    - dismissive
    - passive_aggressive
    min_sentiment_score: -0.3
  compliance:
    enabled: false
    action: WARN
    industry: general
    ai_disclosure: false
    ai_disclosure_text: "This response was generated by AI and may not be fully accurate."
    prohibited_claims: []
    required_disclaimers: []
  malicious_url:
    enabled: false
    action: WARN
    block_ip_urls: true
    block_shorteners: true
    check_data_uris: true
    domain_blocklist: []
    domain_allowlist: []
    max_subdomain_depth: 3
  copyright:
    enabled: false
    action: WARN
    verbatim_threshold: 8
    check_code_licenses: true
    code_license_blocklist:
    - GPL-2.0
    - GPL-3.0
    - AGPL-3.0
    - SSPL-1.0
    check_lyrics: true
    check_books: true
  code_safety:
    enabled: false
    action: WARN
    languages:
    - python
    - javascript
    - sql
    - shell
    block_unsafe_functions: true
    check_sql_injection: true
    check_xss: true
    check_command_injection: true
    check_path_traversal: true
  hallucination:
    enabled: false
    action: WARN
    method: token_overlap
    grounding_threshold: 0.5
    min_claim_words: 3

  # ── Quality Scoring (output context only, informational) ──
  quality_scoring:
    enabled: false
    metrics:
    - groundedness
    - relevance
    - coherence
    - fluency
    - intent_resolution
    - task_adherence
    weights:
      groundedness: 0.25
      relevance: 0.25
      coherence: 0.15
      fluency: 0.10
      intent_resolution: 0.15
      task_adherence: 0.10
tenants:
  tenantA:
    tools:
      enabled: true
      allowed:
      - search_web
      - get_weather
      - send_email
      domain_allowlist:
      - example.com
      - api.weather.com
      - smtp.sendgrid.net
      schemas:
        send_email:
          required:
          - to
          - subject
          - body
          properties:
            to:
              type: string
              maxLength: 100
            subject:
              type: string
              maxLength: 200
            body:
              type: string
              maxLength: 5000
          additionalProperties: false
    structure:
      enabled: false
      expected_format: json
    competitor:
      enabled: true
      competitors:
      - CompetitorX
      - CompetitorY
      - AcmeCorp
      action: RESTRICT
    topic_restriction:
      enabled: true
      blocked_topics:
      - politics
      - religion
      - medical advice
    apps:
      chatlite:
        toxicity:
          action: BLOCK
        agents:
          default:
            pii:
              action: BLOCK
          customer_support:
            toxicity:
              action: WARN
            envs:
              dev:
                jailbreak:
                  enabled: false
      shoplite:
        competitor:
          action: BLOCK
        pii:
          action: REDACT
      guidelite:
        topic_restriction:
          blocked_topics:
          - politics
          - religion
          - medical advice
          - legal advice
  tenantB:
    pii:
      enabled: true
      action: BLOCK
    toxicity:
      enabled: true
      action: BLOCK
      custom_terms:
        spam: medium
        scam: high
    jailbreak:
      threshold: 40
    apps:
      chatlite:
        competitor:
          enabled: true
          competitors:
          - BigTech Inc
          - MegaCorp
          action: BLOCK
  CompanyX:
    apps:
      chatlite:
        secrets:
          enabled: true
          exceptions:
          - sk-test-example
          - EXAMPLE_API_KEY
        exfiltration:
          enabled: true
          block_threshold: 40
        abuse:
          enabled: true
          max_chars_input: 100000
          max_chars_output: 100000
          max_tool_args_size: 50000
          rate_limit_per_minute: 60
          prompt_flood_threshold: 3
          prompt_flood_window: 60
        pii:
          enabled: true
          action: REDACT
        jailbreak:
          enabled: true
          threshold: 60
        toxicity:
          enabled: true
          action: WARN
          custom_terms: {}
        topic_restriction:
          enabled: true
          action: BLOCK
        competitor:
          enabled: true
          action: WARN
          competitors:
          - Acme
        tools:
          enabled: true
          allowed:
          - search_web
          denied: []
          schemas: {}
          domain_allowlist: []
          max_arg_size: 10000
        structure:
          enabled: true
          expected_format: null
          json_schema: null
          xml_root: null
