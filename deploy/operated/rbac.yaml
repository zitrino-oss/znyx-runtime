apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: znyx-operated-diagnostics
  namespace: znyx
rules:
  - apiGroups: ['']
    resources: ['pods', 'services', 'events', 'endpoints', 'persistentvolumeclaims']
    verbs: ['get', 'list', 'watch']
  - apiGroups: ['apps']
    resources: ['deployments', 'replicasets', 'statefulsets']
    verbs: ['get', 'list', 'watch']
  - apiGroups: ['autoscaling']
    resources: ['horizontalpodautoscalers']
    verbs: ['get', 'list', 'watch']
  - apiGroups: ['policy']
    resources: ['poddisruptionbudgets']
    verbs: ['get', 'list', 'watch']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: znyx-operated-diagnostics
  namespace: znyx
subjects:
  - kind: Group
    name: znyx-operated-diagnostics
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: znyx-operated-diagnostics
  apiGroup: rbac.authorization.k8s.io
