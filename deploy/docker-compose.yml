# Znyx, one container.
#
#   docker compose up                          # rules only: http://localhost:8080
#   ZNYX_IMAGE=znyx/znyx:ml docker compose up  # plus the ML model server (in the same container)
#
# One port (8080) serves every API and the local dashboard (/dashboard). Worker
# processes are sized to the container's CPU limit below. The ML image starts its model
# server on loopback inside the container: nothing else needs to reach it, and it holds
# no credential.
#
# API key: set RUNTIME_API_KEY (recommended), or let Znyx generate one into the `data`
# volume on first start and read it with `docker compose exec znyx znyx key`.
#
# Managed mode (signed policy bundles from the console):
#   ZNYX_MODE=managed ZNYX_CONTROL_PLANE_URL=https://console.example.com \
#   ZNYX_RUNTIME_TOKEN=rt_... docker compose up
#
# Air-gapped: set ZNYX_AIRGAPPED=true and mount pre-fetched, sha256-pinned weights at
# /models (see packages/znyx-inference/MODELS.md); nothing is downloaded.
#
# The old two-service layout (znyx/runtime plus the znyx/inference sidecar) still works
# with those images for one deprecation window.
services:
  znyx:
    image: ${ZNYX_IMAGE:-znyx/znyx:latest}
    build:
      context: ..
      dockerfile: Dockerfile
      target: znyx
    ports:
      - "8080:8080"
    environment:
      ZNYX_MODE: ${ZNYX_MODE:-local}
      ZNYX_CONTROL_PLANE_URL: ${ZNYX_CONTROL_PLANE_URL:-}
      ZNYX_RUNTIME_TOKEN: ${ZNYX_RUNTIME_TOKEN:-}
      RUNTIME_API_KEY: ${RUNTIME_API_KEY:-}
      ZNYX_AIRGAPPED: ${ZNYX_AIRGAPPED:-false}
      # Telemetry to Zitrino is off unless you switch it on (see TELEMETRY.md):
      # ZNYX_TELEMETRY: "true"
      # Several replicas behind a load balancer: share limits and budgets in Redis.
      # ZNYX_STATE_BACKEND: redis
      # ZNYX_REDIS_URL: redis://redis:6379/0
    volumes:
      - data:/data
      - models:/models
      # Your own policy:
      # - ./policies.yaml:/app/config/policies.yaml:ro
    cpus: 2
    restart: unless-stopped
    stop_grace_period: 40s

volumes:
  data:
  models:
