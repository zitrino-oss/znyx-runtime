# Znyx runtime + inference sidecar.
#
#   docker compose up
#
# Rules-only, zero external dependencies, nothing to configure. The runtime enforces the
# deterministic rules path out of the box.
#
# To add model-backed (ML) detection, connect the RUNTIME to a control plane:
#
#   ZNYX_MODE=managed
#   ZNYX_CONTROL_PLANE_URL=https://your-control-plane.example.com
#   ZNYX_RUNTIME_TOKEN=rt_...          # Console → project → Keys → Runtime token
#   docker compose --profile ml up
#
# Only the runtime talks to the control plane. It fetches the policy bundle, reads the model
# pins the bundle declares, and hands them to the sidecar over the compose network; the
# sidecar downloads and sha256-verifies the weights into the `inference-models` volume and
# hot-loads them. The sidecar itself needs NO control-plane URL, NO API key and no outbound
# internet access beyond fetching weights. Nothing addresses the sidecar either: the runtime
# reaches it at the fixed in-network name below.
#
# Air-gapped / offline: skip the control plane entirely, mount pre-fetched weights at /models
# and declare them with ZNYX_INFERENCE_TASKS (see packages/znyx-inference/MODELS.md).
services:
  runtime:
    build:
      context: ..
      dockerfile: Dockerfile.runtime
    image: znyx/runtime:latest
    ports:
      - "8080:8080"
    environment:
      ZNYX_MODE: local
      ZNYX_POLICY_PATH: ./config/policies.yaml
      # Secure-by-default. Set a key and require auth in any non-local deploy:
      # RUNTIME_REQUIRE_AUTH: "true"
      # RUNTIME_API_KEY: "<your-key>"
      # Telemetry is OFF by default for the runtime (see TELEMETRY.md). Opt in with:
      # ZNYX_TELEMETRY: "true"
      # Optionally redirect heartbeats to a receiver you operate (default:
      # https://cp.znyx.ai/v1/install-telemetry), or set it to "" to remove the destination:
      # ZNYX_TELEMETRY_URL: "https://your-telemetry-host/v1/install-telemetry"
      #
      # Fixed in-network address of the sidecar below — a deployment convention, not a
      # product setting. The control plane neither stores nor ships it. Change this only if
      # you rename the `inference` service; in Kubernetes run the sidecar in the same pod
      # and leave it unset so the loopback default applies.
      ZNYX_INFERENCE_URL: "http://inference:9000"
      # Managed mode (policy from the control plane) is separate from model provisioning and
      # uses its own runtime token:
      # ZNYX_MODE: managed
      # ZNYX_CONTROL_PLANE_URL: "${ZNYX_CONTROL_PLANE_URL}"
      # ZNYX_RUNTIME_TOKEN: "${ZNYX_RUNTIME_TOKEN}"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ML sidecar. Started with `--profile ml`. Provisioned BY THE RUNTIME: it needs no
  # control-plane URL and no credential of its own. The runtime pushes the desired model
  # pins to it every bundle cycle and it installs them. Weights are never baked into the
  # image — they land in the `inference-models` volume, sha256-verified against what the
  # control plane expects. See packages/znyx-inference/MODELS.md.
  inference:
    profiles: ["ml"]
    build:
      context: ..
      dockerfile: Dockerfile.inference
    image: znyx/inference:latest
    # Bound to loopback only, deliberately. The runtime reaches it over the compose network
    # and does not need a published port; the binding exists so an operator can check
    # `curl localhost:9000/v1/models`. The sidecar has NO authentication of its own and
    # /v1/models/install triggers multi-gigabyte downloads, so never widen this to 0.0.0.0.
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - inference-models:/models
    environment:
      PORT: "9000"
      ZNYX_INFERENCE_ARTIFACTS_DIR: "/models"
      # No control-plane settings here, deliberately. Model provisioning is driven by the
      # runtime over the compose network (POST /v1/models/desired), so this service holds no
      # credential and reads no policy. With no runtime attached it simply serves whatever is
      # already in /models (or nothing), and the runtime falls back to rules.
      #
      # Offline/air-gapped fallback: declare pre-mounted weights explicitly instead of
      # provisioning them from the control plane. Ignored once pins arrive for a task.
      # ZNYX_INFERENCE_TASKS: >
      #   {"prompt_injection":{"runner":"classifier","model_id":"protectai/deberta-v3-base-prompt-injection-v2","revision":"main","threshold":0.5},
      #    "toxicity":{"runner":"classifier","model_id":"unitary/toxic-bert","revision":"main","threshold":0.5},
      #    "language":{"runner":"language","model_id":"papluca/xlm-roberta-base-language-detection","revision":"main","threshold":0.5},
      #    "nli":{"runner":"nli","model_id":"cross-encoder/nli-deberta-v3-large","revision":"main","threshold":0.5},
      #    "pii_ner":{"runner":"ner","model_id":"Davlan/bert-base-multilingual-cased-ner-hrl","revision":"main","threshold":0.5}}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  inference-models:
