{{- if not .Values.existingSecret }}
{{- $name := include "znyx.secretName" . }}
{{- $apiKey := .Values.secrets.apiKey | default "" | b64enc }}
{{- if not .Values.secrets.apiKey }}
{{- /* Keep the key generated by an earlier install or upgrade; generate one only once. */}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- if and $existing $existing.data (hasKey $existing.data "RUNTIME_API_KEY") }}
{{- $apiKey = index $existing.data "RUNTIME_API_KEY" }}
{{- else }}
{{- $apiKey = printf "zx_%s" (randAlphaNum 40) | b64enc }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "znyx.labels" . | nindent 4 }}
type: Opaque
data:
  RUNTIME_API_KEY: {{ $apiKey | quote }}
  {{- with .Values.secrets.runtimeToken }}
  ZNYX_RUNTIME_TOKEN: {{ . | b64enc | quote }}
  {{- end }}
  {{- with .Values.secrets.redisUrl }}
  ZNYX_REDIS_URL: {{ . | b64enc | quote }}
  {{- end }}
{{- end }}
