apiVersion: v1
kind: Pod
metadata:
  name: {{ include "znyx.fullname" . }}-test-connection
  namespace: {{ .Release.Namespace }}
  # Deliberately not the selector labels: the test pod must never be picked up by the
  # Service, the Deployment or the NetworkPolicy.
  labels:
    app.kubernetes.io/name: {{ include "znyx.name" . }}-test
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: test
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  {{- with .Values.imagePullSecrets }}
  imagePullSecrets:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  securityContext:
    runAsNonRoot: true
    runAsUser: 100
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: health
      {{- if .Values.test.useRuntimeImage }}
      image: {{ include "znyx.image" . | quote }}
      {{- else }}
      image: "{{ .Values.test.image.repository }}:{{ .Values.test.image.tag }}"
      {{- end }}
      imagePullPolicy: {{ .Values.test.image.pullPolicy }}
      command:
        {{- if .Values.test.useRuntimeImage }}
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://{{ include "znyx.fullname" . }}.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.service.port }}/healthz', timeout=10)"
        {{- else }}
        - curl
        - --fail
        - --silent
        - --show-error
        - --max-time
        - "10"
        - "http://{{ include "znyx.fullname" . }}.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.service.port }}/healthz"
        {{- end }}
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
