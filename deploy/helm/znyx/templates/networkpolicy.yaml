{{- if include "znyx.networkPolicyEnabled" . }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "znyx.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "znyx.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "znyx.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Callers reach the one API port. The ML model server listens on loopback inside the
    # pod and is never reachable from outside it, so there is no rule for it.
    - from:
        {{- if .Values.networkPolicy.ingressFrom }}
        {{- toYaml .Values.networkPolicy.ingressFrom | nindent 8 }}
        {{- else }}
        - podSelector: {}
        {{- end }}
      ports:
        - port: http
          protocol: TCP
  egress:
    # DNS is always allowed.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    {{- if .Values.networkPolicy.egressTo }}
    # Explicit destinations only (for example the control plane).
    - to:
        {{- toYaml .Values.networkPolicy.egressTo | nindent 8 }}
      ports:
        {{- toYaml .Values.networkPolicy.egressPorts | nindent 8 }}
    {{- else if not .Values.airgapped }}
    # Not air-gapped: HTTPS to anywhere (control plane, model downloads, external judges).
    - ports:
        {{- toYaml .Values.networkPolicy.egressPorts | nindent 8 }}
    {{- end }}
    {{- with .Values.networkPolicy.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
