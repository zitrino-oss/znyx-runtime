# Least-privilege RBAC for the operator. Kopf runs in --standalone mode (see main.py), so
# none of its peering resources (kopfpeerings) are needed.
apiVersion: v1
kind: Namespace
metadata:
  name: znyx-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: znyx-operator
  namespace: znyx-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: znyx-operator
rules:
  # The custom resource and its status.
  - apiGroups: ["znyx.ai"]
    resources: ["znyxinstances"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["znyx.ai"]
    resources: ["znyxinstances/status"]
    verbs: ["get", "patch", "update"]
  # What kopf itself needs to discover the resource and the namespaces it watches.
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["list", "watch"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  # Children. Server-side apply creates and updates through "patch" (and "create" for the
  # first write). Secrets: never listed, read, or deleted beyond get on the one it owns.
  - apiGroups: [""]
    resources: ["configmaps", "services", "persistentvolumeclaims"]
    verbs: ["get", "create", "patch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "create", "patch"]
  # Deleted when the spec stops asking for them (replicas back to 1, policy switched off).
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "create", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "create", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: znyx-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: znyx-operator
subjects:
  - kind: ServiceAccount
    name: znyx-operator
    namespace: znyx-system
