# Model artifact storage for the inference sidecar. Apply only if you enable ML.
#
#   kubectl apply -f inference-pvc.yaml
#
# ReadWriteMany because the sidecar runs as a same-pod container in a multi-replica
# Deployment, so every replica mounts this claim. If your storage class has no RWX mode,
# either drop the runtime to one replica, or move the sidecar into a StatefulSet with a
# volumeClaimTemplate so each replica gets its own volume.
#
# Sizing: the sidecar stores ONNX-exported weights per pinned model. Budget ~1GB per
# classifier/NER task and ~2.5GB for a guard LLM; 20Gi comfortably holds the default pins.
# The volume must be writable — the sidecar downloads into it (weights are never baked into
# the image, and are sha256-verified against what the control plane expects).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: znyx-inference-models
  labels:
    app: znyx-runtime
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 20Gi
  # Uncomment and set to a class that supports ReadWriteMany (e.g. azurefile, efs-sc, nfs).
  # storageClassName: azurefile
