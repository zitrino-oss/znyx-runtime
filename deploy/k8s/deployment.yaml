# Znyx runtime, with the optional ML sidecar as a same-pod container.
#
# The sidecar is co-located deliberately: the runtime then reaches it on
# http://localhost:9000 with nothing configured, and because that address is genuinely
# loopback the ML layer is correctly treated as in-boundary (the F4 egress gate does not
# apply to a call that never leaves the pod). No address is stored in the control plane and
# none is shipped in the policy bundle.
#
# To enable ML: create the secret and PVC below, then uncomment the `inference` container.
#
#   kubectl create secret generic znyx-inference-secrets \
#     --from-literal=ZNYX_INFERENCE_API_KEY=gr_...        # Console → project → Keys
#
# Note the trade-off of same-pod co-location: each replica provisions and holds its own copy
# of the weights, so the PVC must be ReadWriteMany (or use one volume per replica via a
# StatefulSet). For a large estate, running the sidecar as its own Deployment and setting
# ZNYX_INFERENCE_URL on the runtime is still supported — but then the address is off-box, the
# egress gate applies, and you are back to managing an address.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: znyx-runtime
  labels:
    app: znyx-runtime
spec:
  replicas: 2
  selector:
    matchLabels:
      app: znyx-runtime
  template:
    metadata:
      labels:
        app: znyx-runtime
    spec:
      containers:
        - name: runtime
          # Replace with your published image tag.
          image: IMAGE_PLACEHOLDER
          ports:
            - containerPort: 8080
          env:
            - name: ZNYX_MODE
              value: "local"
            - name: ZNYX_POLICY_PATH
              value: "./config/policies.yaml"
            # Secure-by-default: require auth outside local dev.
            - name: RUNTIME_REQUIRE_AUTH
              value: "true"
            - name: RUNTIME_API_KEY
              valueFrom:
                secretKeyRef:
                  name: znyx-runtime-secrets
                  key: RUNTIME_API_KEY
            # ZNYX_INFERENCE_URL is intentionally NOT set. With the sidecar in this pod the
            # runtime's default (http://localhost:9000) is already correct, and leaving it
            # unset is what keeps the call loopback/in-boundary.
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

        # ── Optional ML sidecar ──────────────────────────────────────────────────────────
        # Self-provisioning: on startup it pings the control plane for this project's model
        # pins, downloads and sha256-verifies the weights into /models, and hot-loads them.
        # Until a model is loaded, ML tasks return 503 and the runtime falls back to
        # deterministic rules — an unreachable control plane is never an outage.
        #
        # - name: inference
        #   image: znyx/inference:latest
        #   ports:
        #     - containerPort: 9000
        #   env:
        #     # The two settings that drive model provisioning.
        #     - name: ZNYX_CONTROL_PLANE_URL
        #       value: "https://cp.znyx.ai"
        #     - name: ZNYX_INFERENCE_API_KEY
        #       valueFrom:
        #         secretKeyRef:
        #           name: znyx-inference-secrets
        #           key: ZNYX_INFERENCE_API_KEY
        #     # One inference key serves the whole project; this names which environment this
        #     # deployment is, so it picks up env-specific pins over the project-wide cascade.
        #     - name: ZNYX_ENVIRONMENT_NAME
        #       value: "prod"
        #     - name: ZNYX_INFERENCE_ARTIFACTS_DIR
        #       value: "/models"
        #   volumeMounts:
        #     - name: models
        #       mountPath: /models
        #   readinessProbe:
        #     httpGet:
        #       path: /healthz
        #       port: 9000
        #     initialDelaySeconds: 10
        #     periodSeconds: 10
        #   resources:
        #     requests:
        #       cpu: "500m"
        #       memory: "2Gi"
        #     limits:
        #       cpu: "2"
        #       memory: "4Gi"

      # Uncomment alongside the inference container above, and apply inference-pvc.yaml.
      # volumes:
      #   - name: models
      #     persistentVolumeClaim:
      #       claimName: znyx-inference-models
