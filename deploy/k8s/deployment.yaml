# Znyx runtime, with the optional ML sidecar as a same-pod container.
#
# The sidecar is co-located deliberately: the runtime then reaches it on
# http://localhost:9000 with nothing configured, and because that address is genuinely
# loopback the ML layer is correctly treated as in-boundary (the F4 egress gate does not
# apply to a call that never leaves the pod). No address is stored in the control plane and
# none is shipped in the policy bundle.
#
# To enable ML: create the secret below, then uncomment the `inference` container and the
# `volumes` block at the bottom.
#
#   kubectl create secret generic znyx-inference-secrets \
#     --from-literal=ZNYX_INFERENCE_API_KEY=gr_...        # Console → project → Keys
#
# Note the trade-off of same-pod co-location: each replica provisions and holds its own copy
# of the weights in a pod-local emptyDir, so a replaced pod re-downloads them. That is the
# deliberate default — no shared volume means no concurrent writers to one artifact tree and
# no cache that can outlive a pod in a broken state. If cold-start time matters more, move the
# sidecar into a StatefulSet with a volumeClaimTemplate so each replica gets its own
# persistent volume; do not point every replica at one shared ReadWriteMany claim. For a large
# estate, running the sidecar as its own Deployment and setting ZNYX_INFERENCE_URL on the
# runtime is still supported — but then the address is off-box, the egress gate applies, and
# you are back to managing an address.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: znyx-runtime
  labels:
    app: znyx-runtime
spec:
  replicas: 2
  selector:
    matchLabels:
      app: znyx-runtime
  template:
    metadata:
      labels:
        app: znyx-runtime
    spec:
      containers:
        - name: runtime
          # Replace with your published image tag.
          image: IMAGE_PLACEHOLDER
          ports:
            - containerPort: 8080
          env:
            - name: ZNYX_MODE
              value: "local"
            - name: ZNYX_POLICY_PATH
              value: "./config/policies.yaml"
            # Secure-by-default: require auth outside local dev.
            - name: RUNTIME_REQUIRE_AUTH
              value: "true"
            - name: RUNTIME_API_KEY
              valueFrom:
                secretKeyRef:
                  name: znyx-runtime-secrets
                  key: RUNTIME_API_KEY
            # ZNYX_INFERENCE_URL is intentionally NOT set. With the sidecar in this pod the
            # runtime's default (http://localhost:9000) is already correct, and leaving it
            # unset is what keeps the call loopback/in-boundary.
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

        # ── Optional ML sidecar ──────────────────────────────────────────────────────────
        # Provisioned BY THE RUNTIME container above, over pod-local loopback. The runtime
        # fetches the policy bundle, reads the model pins it declares, and pushes them here
        # every cycle; this container then downloads and sha256-verifies the weights into
        # /models and hot-loads them. Until a model is loaded, ML tasks return 503 and the
        # runtime falls back to deterministic rules — an unreachable control plane is never
        # an outage.
        #
        # Note what is NOT here: no ZNYX_CONTROL_PLANE_URL, no API key, no secretKeyRef.
        # This container never calls the control plane, so it needs no credential and can be
        # denied egress entirely apart from fetching model weights.
        #
        # - name: inference
        #   image: znyx/inference:latest
        #   ports:
        #     - containerPort: 9000
        #   env:
        #     - name: ZNYX_INFERENCE_ARTIFACTS_DIR
        #       value: "/models"
        #   volumeMounts:
        #     - name: models
        #       mountPath: /models
        #   readinessProbe:
        #     httpGet:
        #       path: /healthz
        #       port: 9000
        #     initialDelaySeconds: 10
        #     periodSeconds: 10
        #   resources:
        #     requests:
        #       cpu: "500m"
        #       memory: "2Gi"
        #     limits:
        #       cpu: "2"
        #       memory: "4Gi"

      # Uncomment alongside the inference container above. Pod-scoped on purpose: the sidecar
      # re-provisions the weights whenever a pod is replaced, and an interrupted download
      # leaves nothing behind to be mistaken for a complete artifact on the next start.
      #
      # sizeLimit keeps a multi-gigabyte download off the node's ephemeral storage budget —
      # budget ~1GB per classifier/NER task and ~2.5GB for a guard LLM. Exceeding it evicts the
      # pod, so raise it if you pin more than the defaults.
      # volumes:
      #   - name: models
      #     emptyDir:
      #       sizeLimit: 25Gi
