# Vendor secrets benchmark corpus v1.1 - labelled samples for every pattern
# shipped by SecretsDetector. All secrets are synthetic (not real API keys)
# but structurally valid so the detector's pattern, entropy, and length
# checks all fire.
#
# Coverage target:
#   3+ positive samples AND 3+ near-miss negatives per shipped pattern.
#
# Acceptance criteria:
#   recall >= 0.95 on positives
#   false-positive rate <= 0.01 on negatives (ANY secret hit counts as FP)
#

dataset_name: vendor-secrets-v1.1
version: 2
created: 2026-04-19

# =================================================================
# POSITIVE SAMPLES - every pattern has at least 3.
# =================================================================
