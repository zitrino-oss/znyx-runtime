# =================================================================
# NEGATIVE SAMPLES - 3 per pattern, crafted to be near-miss (wrong
# checksum, wrong format, missing keyword for anchor-required types).
# Strict FPR: no regional rule may fire on any of these.
# =================================================================
negative_samples:
  # ---------- India ----------
  - { id: n-in_pan-1, identifier_types: [in_pan], text: "Random code A1B2C3D4E5" }             # wrong PAN shape
  - { id: n-in_pan-2, identifier_types: [in_pan], text: "SKU ABCDE12345" }                     # missing trailing letter
  - { id: n-in_pan-3, identifier_types: [in_pan], text: "Product ABC1234DEF" }                 # wrong positional split
  - { id: n-in_aadhaar-1, identifier_types: [in_aadhaar], text: "Ticket 1234 5678 9012" }      # fails Verhoeff
  - { id: n-in_aadhaar-2, identifier_types: [in_aadhaar], text: "Order 1111 2222 3333" }      # fails Verhoeff
  - { id: n-in_aadhaar-3, identifier_types: [in_aadhaar], text: "Batch 9999 8888 7777" }      # fails Verhoeff
  - { id: n-in_gstin-1, identifier_types: [in_gstin], text: "Batch 27AAPFU0939F1XV" }          # position-14 must be Z
  - { id: n-in_gstin-2, identifier_types: [in_gstin], text: "Code 27AAPFU0939F1A5" }           # still not Z at pos 14
  - { id: n-in_gstin-3, identifier_types: [in_gstin], text: "Item XX27AAPF0939F1ZV" }          # wrong prefix shape
  - { id: n-in_din-1, identifier_types: [in_din], text: "Invoice 12345678" }                   # no DIN keyword
  - { id: n-in_din-2, identifier_types: [in_din], text: "SKU 87654321 fulfilled" }             # no DIN keyword
  - { id: n-in_din-3, identifier_types: [in_din], text: "Order 00012345 confirmed" }           # no DIN keyword
  - { id: n-in_ifsc-1, identifier_types: [in_ifsc], text: "Code HDFC1000001" }                 # position-5 must be 0
  - { id: n-in_ifsc-2, identifier_types: [in_ifsc], text: "Code HDFC00000" }                   # too short
  - { id: n-in_ifsc-3, identifier_types: [in_ifsc], text: "Code hdfc0000001" }                 # lowercase prefix
  - { id: n-in_upi-1, identifier_types: [in_upi], text: "email alice@company.com" }            # handle has a dot → excluded
  - { id: n-in_upi-2, identifier_types: [in_upi], text: "chat with @alice" }                   # no VPA shape
