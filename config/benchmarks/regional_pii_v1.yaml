# Regional PII benchmark corpus v1.1 - labelled samples for every regional
# identifier the PII detector ships.
#
# Coverage target:
#   3+ positive samples AND 3+ near-miss negatives per shipped pattern.
#
# Acceptance criteria:
#   recall >= 0.95 on positives
#   false-positive rate <= 0.01 on negatives (ANY regional hit counts as FP)
#

dataset_name: regional-pii-v1.1
version: 2
created: 2026-04-19

