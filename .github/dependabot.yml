version: 2
updates:
  # Python dependencies — one entry per package (manifests live under packages/*).
  - package-ecosystem: pip
    directories:
      - "/packages/znyx-core"
      - "/packages/znyx-runtime"
      - "/packages/znyx-inference"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels: ["dependencies", "python"]
    # Collapse minor/patch bumps into a single PR; majors stay separate so
    # breaking changes still get individual review.
    groups:
      pip-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # GitHub Actions used in workflows
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels: ["dependencies", "ci"]
    groups:
      actions-all:
        patterns: ["*"]

  # Base images in the Dockerfiles (non-standard names → list explicitly).
  - package-ecosystem: docker
    directories:
      - "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels: ["dependencies", "docker"]
    groups:
      docker-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
