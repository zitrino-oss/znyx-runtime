# Exclude synthetic detector test data from secret-scanning ALERTS.
# config/benchmarks/ and config/packs/ contain fake, structurally-valid
# credentials used only to exercise the bundled secret/PII detectors — they
# are not real secrets. (Note: this suppresses alerts; GitHub push protection
# is evaluated separately at push time.)
paths-ignore:
  - "config/benchmarks/**"
  - "config/packs/**"
