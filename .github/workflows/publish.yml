# Publish znyx-core and znyx-runtime to PyPI, and the runtime image to a registry.
#
# PyPI uses OIDC Trusted Publishing (no long-lived token). Before the first run,
# register each project's trusted publisher on PyPI:
#   PyPI project -> Settings -> Publishing -> add a GitHub publisher with
#   owner=zitrino-oss, repo=znyx-runtime, workflow=publish.yml, environment=pypi
#
# Docker push still uses registry credentials (Docker Hub has no OIDC path):
#   REGISTRY_USERNAME / REGISTRY_TOKEN   (repository secrets)
# If you move the image to GHCR, drop these and use `permissions: packages: write`
# with the built-in GITHUB_TOKEN instead.
#
# The first PyPI release is intended to be done manually (to claim the names and
# verify the install). After that, tag a release to trigger this workflow so the
# PyPI packages stay in lockstep with the Docker image.
name: publish

on:
  release:
    types: [published]
  workflow_dispatch:

# Least privilege by default; jobs opt into more only where needed.
permissions:
  contents: read

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write # OIDC token for PyPI Trusted Publishing
    strategy:
      matrix:
        package: [packages/znyx-core, packages/znyx-runtime, packages/znyx-inference]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Build
        run: |
          python -m pip install --upgrade build twine
          python -m build ${{ matrix.package }}
      - name: Check
        run: twine check ${{ matrix.package }}/dist/*
      - name: Publish
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # release/v1
        with:
          packages-dir: ${{ matrix.package }}/dist/
          skip-existing: true

  image:
    runs-on: ubuntu-latest
    environment: dockerhub
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - dockerfile: Dockerfile.runtime
            image_name: znyx/runtime
          - dockerfile: Dockerfile.inference
            image_name: znyx/inference
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Log in to registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ matrix.image_name }}:latest,${{ matrix.image_name }}:${{ github.ref_name }}
