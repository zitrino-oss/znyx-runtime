name: Security

# SAST, secret scanning, container image scanning, and CodeQL. Znyx Runtime is
# a security product, so it carries deeper scanning than dependency audit alone.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # Weekly Monday 6:00 UTC

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sast-bandit:
    name: SAST (bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: pip install bandit
      # Gate on HIGH severity / HIGH confidence findings.
      - run: bandit -r packages/ -lll -iii

  sast-semgrep:
    name: SAST (semgrep)
    runs-on: ubuntu-latest
    container:
      # Pinned by digest (mutable :latest is a supply-chain risk). Dependabot's
      # docker updater keeps this current.
      image: semgrep/semgrep:1.169.0@sha256:2b33f46ba66cf8cc2ad59ccfa7d22951fd00c632c38f1339e84ec8e6e641a942
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - run: semgrep scan --config p/python --config p/security-audit --config p/secrets --error packages/

  secret-scan:
    name: Secret scan (trivy fs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: secret
          scan-ref: .
          # config/benchmarks and config/packs hold synthetic detector test
          # data (fake API keys / PII), not real secrets. Everything else,
          # including config/policies.yaml and all app code, is still scanned.
          skip-dirs: config/benchmarks,config/packs
          exit-code: "1"
          severity: HIGH,CRITICAL

  image-scan:
    name: Image vuln scan (trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - run: docker build -f Dockerfile.runtime -t znyx-runtime:ci .
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: znyx-runtime:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          # Don't fail on base-image CVEs that have no upstream fix yet;
          # do fail on anything fixable.
          ignore-unfixed: "true"
          # Documented base-image build-tooling CVEs (not in runtime path).
          trivyignores: .trivyignore
          exit-code: "1"

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: github/codeql-action/init@1ad29ea4a422cce9a242a9fae469541dcd08addc # v4
        with:
          languages: python
      - uses: github/codeql-action/analyze@1ad29ea4a422cce9a242a9fae469541dcd08addc # v4
