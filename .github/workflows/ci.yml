name: CI

# Byte-compile and import check. Runs on every PR and on pushes to main,
# providing a status check that branch protection can require before merge.
on:
  push:
    branches: [main, master]
  pull_request:

# Least privilege: this workflow only needs to read the repo.
permissions:
  contents: read

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile & import check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install packages
        # Install the shippable packages so the import check exercises real deps.
        run: pip install ./packages/znyx-core ./packages/znyx-runtime

      - name: Byte-compile
        run: python -m compileall -q packages

      - name: Import check
        run: python -c "import znyx_core, znyx_runtime"
